name: "Cheatsheet staleness prune"

# This workflow examines the GitHub usage history of the owner (intent I-3 O-3).
# It finds each cheatsheet whose target is not in the activity of the owner for more than 1 year.
# Then it opens ONE issue that proposes to delete these sheets.
# The workflow only opens an issue. It NEVER deletes, commits, or opens a PR.
# The owner replies on the issue. The reply starts cheatsheet-delete.yml, which opens the deletion PR.

on:
  schedule:
    - cron: "37 5 1 * *"   # 05:37 UTC on day 1 of each month
  workflow_dispatch: {}     # always let a person start a manual run for tests

permissions:                # least privilege: this job only opens an issue
  contents: read            # read the checked-out repo (existing cheatsheets and index)
  issues: write
  id-token: write           # OIDC. claude-code-action requires it.

concurrency:
  group: "cheatsheet-prune"
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # Maximum run time. You can change this value.
    env:
      GH_TOKEN: ${{ github.token }}                  # issue writes go to THIS repo
      GH_SCAN_TOKEN: ${{ secrets.GH_SCAN_TOKEN }}    # read-only PAT for the cross-repo activity scan
    steps:
      - name: Preflight - require the read-only scan token
        run: |
          if [ -z "${GH_SCAN_TOKEN}" ]; then
            echo "::error::GH_SCAN_TOKEN secret is not set. Add a read-only fine-grained PAT (contents+metadata, all repos) named GH_SCAN_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6. Change the SHA only intentionally.

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8. Change the SHA only intentionally.
        # The agent reads other repos with `uv run scripts/gh_scan.py`, so it needs uv on PATH.

      - uses: anthropics/claude-code-action@41ea7642c1436fa0ee57aae58347904b71a5af27  # v1. Change the SHA only intentionally.
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Glob,Grep,WebSearch,WebFetch,Bash(date:*),Bash(uv run scripts/gh_scan.py:*),Bash(gh api:*),Bash(gh search code:*),Bash(gh search commits:*),Bash(gh repo list:*),Bash(gh repo view:*),Bash(gh issue list:*),Bash(gh issue create:*)"
          prompt: |
            You are the monthly staleness agent for this cheatsheet repo (intent I-3, outcome O-3).
            Your task: find the cheatsheets that the owner does not use now. Propose to delete them in ONE issue.
            You NEVER delete a file, commit, or open a PR.
            Your only output is one issue. The owner replies on it to start the deletion workflow.

            ## Orientation (read first)
            - Read `CLAUDE.md`, `specs/CONSTITUTION.md`, and `.claude/skills/cheatsheet/SKILL.md`.
            - List every `cheatsheets/*.md` file and read `index.md`. You can propose only these sheets for deletion.
            - For each sheet, get its TARGET from the H1 (`# <use case> with <target>`).
              Also use the italic source line `_Grounded in <target> …_`.
            - Get the login one time: `uv run scripts/gh_scan.py api user --jq .login`. The default token cannot read `/user`.
            - Calculate the staleness cutoff date: `date -u -d '1 year ago' +%Y-%m-%d`.

            ## Two-token rule (NON-NEGOTIABLE security boundary)
            - For CROSS-REPO READS (the usage scan), ALWAYS put the read-only token first. For example:
              `uv run scripts/gh_scan.py search code --owner <login> "<target>" --json repository,path`,
              `uv run scripts/gh_scan.py search commits --author <login> --committer-date '>=<cutoff>' --json repository,sha`.
            - For THE ISSUE WRITE (`gh issue list`/`gh issue create`) in THIS repo, use plain `gh` (default token).
            - NEVER read other repos with the default token.
            - NEVER write with the scan token.
            - You have NO write access to the repo contents. You CANNOT open PRs.
            - Your only output is one issue.

            ## Privacy (Constitution P-7). This applies to the full issue (title and body).
            - Before you cite a repo, get its visibility:
              `uv run scripts/gh_scan.py repo view <login>/<repo> --json visibility -q .visibility`.
            - NEVER give the name, slug, or URL of a PRIVATE repo in the issue.
            - NEVER quote code from a PRIVATE repo in the issue.
            - Make evidence from private repos general.
            - You can cite public repos as evidence.

            ## Task: use gh to find stale sheets, then propose deletions in ONE issue
            1. For each cheatsheet, decide if the owner USED its TARGET IN THE LAST YEAR.
               A target is USED if ANY of these checks finds a result after the cutoff. Use the scan token for all checks.
               - `uv run scripts/gh_scan.py search code --owner <login> "<target>"` finds a file,
                 AND that repo has commits after the cutoff. OR:
               - `uv run scripts/gh_scan.py search commits --author <login> --committer-date '>=<cutoff>'`
                 finds commits in a repo that contains the target.
               Each credible signal after the cutoff means "used".
               The sheet is STALE only when the target has ZERO signals after the cutoff.
            2. Keep ONLY the stale sheets. If NO sheet is stale, open NO issue. Do nothing when all sheets are in use.
            3. Look for duplicates: `gh issue list --state open --search "Cheatsheet staleness"`.
               If an open staleness issue already proposes the same sheets, SKIP. Do not open a duplicate.
            4. If one or more sheets are stale, open exactly ONE issue with `gh issue create`:
               - Title: `Cheatsheet staleness — <Month YYYY>`
               - Body: a short introduction, then a markdown table, then a one-line request. Use this shape.
                 Column 4 MUST contain the exact `cheatsheets/<slug>.md` path.
                 Then the delete workflow does not need to calculate the slug again.

                 ```markdown
                 These cheatsheets cover targets that have no activity in your GitHub history since <cutoff>.
                 Write a comment with the numbers of the sheets that you want to delete.

                 | # | Cheatsheet (use case) | Target | Cheatsheet file | Last seen | Evidence |
                 |---|---|---|---|---|---|
                 | 1 | <use case> | `<target>` | `cheatsheets/<slug>.md` | <date or "none found"> | `owner/repo` (public; private generalized) |
                 | 2 | ... | ... | ... | ... | ... |

                 Reply on THIS open issue as the repo owner. Give the numbers to delete, for example "1 and 3".
                 Your comment starts the delete workflow. The workflow opens one PR that removes the sheets.
                 You do not need a local command.
                 ```

            ## Finish
            - If no sheet is stale, open NO issue and print "no stale cheatsheets".
            - If a duplicate issue already exists, open NO issue and print "no stale cheatsheets".
            - Report these items:
              - the sheets that you scanned
              - the staleness cutoff that you used
              - the sheets that you found stale
              - the number of the issue that you opened, or "none"
