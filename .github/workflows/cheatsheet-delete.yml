name: "Cheatsheet delete from selection"

# This workflow completes the deletion loop in the GitHub web UI (intent I-3 O-4/O-5).
# The trigger is a selection comment from the repo OWNER, for example "1 and 3".
# The comment must be on an open "Cheatsheet staleness …" issue.
# The workflow deletes each chosen sheet with the deterministic scripts/delete_cheatsheet.py.
# Then it opens ONE PR for the whole run, and a human reviews that PR.
# The PR contains every deletion and the index update.
# The PR body contains `Closes #<issue>`. When the owner merges the PR, GitHub closes the issue (O-5).
# There is no local step and no auto-merge.
# Deletion runs the SCRIPT. It never runs the cheatsheet skill (P-6).
#
# CAVEAT: issue_comment workflows ALWAYS run the copy on the DEFAULT BRANCH (main).
# They never run the copy on a feature branch. As a result:
#   1. This file has an effect only after the owner merges it to main.
#   2. You cannot test the issue_comment path from a branch. For tests before the
#      merge, use the workflow_dispatch path with the issue_number and selection inputs.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Number of the staleness issue that contains the table"
        required: true
      selection:
        description: 'Sheet numbers to delete, for example "1 and 3"'
        required: true

permissions:                # least privilege: open PRs and acknowledge the comment that started the run
  contents: write
  pull-requests: write
  issues: write             # add a 👀 reaction to the comment that started this run
  id-token: write           # OIDC. claude-code-action requires it.

concurrency:
  # One group for each issue. Selections on different issues run in parallel.
  # Comments on the SAME issue run one after the other. Two runs cannot try to create the same branch at the same time.
  group: "cheatsheet-delete-${{ github.event.issue.number || inputs.issue_number }}"
  cancel-in-progress: false

jobs:
  delete:
    # issue_comment path: only the owner, only an open STALENESS issue, and not a PR comment.
    # The workflow_dispatch path always runs (for manual tests).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.state == 'open' &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, 'Cheatsheet staleness'))
    runs-on: ubuntu-latest
    timeout-minutes: 20       # Deletion is fast. It does no mining and no doc grounding. You can change this value.
    env:
      # gh writes (branch push, PRs) go to THIS repo with the default token.
      GH_TOKEN: ${{ github.token }}
      # Read-only PAT (contents and metadata, all repos, private repos too). Use it for cross-repo checks of evidence.
      GH_SCAN_TOKEN: ${{ secrets.GH_SCAN_TOKEN }}
      # The workflow does not trust event and input data. It passes the data as env. It NEVER puts it into the prompt.
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      SELECTION_COMMENT: ${{ github.event.comment.body }}
      DISPATCH_SELECTION: ${{ inputs.selection }}
    steps:
      - name: Acknowledge the comment that started this run with 👀
        # Only the issue_comment path runs this step. The workflow_dispatch path has no comment.
        if: github.event_name == 'issue_comment'
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: Preflight - require the read-only scan token
        run: |
          if [ -z "${GH_SCAN_TOKEN}" ]; then
            echo "::error::GH_SCAN_TOKEN secret is not set. Add a read-only fine-grained PAT (contents+metadata, all repos) named GH_SCAN_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6. Change the SHA only intentionally.
        with:
          fetch-depth: 0      # Full history, so that the run branch starts cleanly from main.

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8. Change the SHA only intentionally.
        # `uv run scripts/delete_cheatsheet.py` (below) needs uv and Python on PATH.
        # The runner has neither. uv downloads the Python version that the script requires (>=3.14) when necessary.

      - uses: anthropics/claude-code-action@41ea7642c1436fa0ee57aae58347904b71a5af27  # v1. Change the SHA only intentionally.
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(date:*),Bash(gh repo view:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(git status:*),Bash(git diff:*),Bash(git switch:*),Bash(git checkout:*),Bash(git rm:*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin auto/delete/:*),Bash(uv run:*)"
          prompt: |
            You are the DELETE agent for this cheatsheet repo (intent I-3, O-4/O-5). A selection comment starts you.
            The owner selected one or more sheets to delete. The owner did this with a comment on a "Cheatsheet staleness …" issue.
            Your task has two parts:
            - Delete every selected sheet with the deterministic deletion script.
            - Open ONE pull request for the whole run. This PR contains ALL deletions and the index update.
            The whole loop must complete in the GitHub web UI.
            You NEVER merge, approve, or close anything.
            Put the `Closes #N` keyword in the PR body. When the human merges the single PR, GitHub closes the issue.
            This is the only way to close the issue, and the human starts it.

            ## Deletion is deterministic. Use the SCRIPT, not manual edits.
            - To remove a sheet, run ONLY `uv run scripts/delete_cheatsheet.py <slug>`.
            - The script deletes `cheatsheets/<slug>.md` and writes `index.md` again (Constitution P-4/P-6).
            - You have NO Edit or Write tools. Never delete a file manually. Never edit `index.md` manually.

            ## Orientation (read first)
            - Read `CLAUDE.md` and `specs/CONSTITUTION.md`.
            - Get today's date: `date -u +%Y-%m-%d`.
            - You start on the default branch of the repo.

            ## Resolve the selection (do this before all other steps)
            - The issue number is in `$ISSUE_NUMBER`. Read the issue with the default token from THIS repo:
              `gh issue view "$ISSUE_NUMBER" --json title,body,state`.
            - CONFIRM that the issue state is OPEN.
            - CONFIRM that the issue title starts with `Cheatsheet staleness`.
            - If one of these checks fails, STOP immediately. Do not open a PR.
            - The issue body contains a markdown table: `| # | Cheatsheet (use case) | Target | Cheatsheet file | … |`.
            - Column 4 contains the `cheatsheets/<slug>.md` path in backticks. This path is the input for the deletion.
            - The selected numbers come from `$SELECTION_COMMENT` (comment trigger) or `$DISPATCH_SELECTION` (manual run).
            - Use the variable that is not empty, and get the integers from it.
            - Accept these forms: "1 and 3", "1,3", "1 & 3", "1 3".
            - For each selected number, read THAT row. Get the cheatsheet file or slug from column 4.
            - If a selected number has no matching row, skip it and report it.
            - NEVER invent a sheet.

            ## Two-token rule (NON-NEGOTIABLE security boundary)
            - You do a CROSS-REPO READ only to check evidence again.
            - For each CROSS-REPO READ, ALWAYS put the read-only token first.
              For example: `uv run scripts/gh_scan.py repo view <login>/<repo> --json visibility`.
            - To READ THE ISSUE in THIS repo, use plain `gh` or `git`.
            - To WRITE in THIS repo (branch push, `gh pr create`), use plain `gh` or `git`.
            - NEVER read other repos with the default token.
            - NEVER write with the scan token.
            - You have NO permission to merge, approve, or close. You MUST NOT try to do these things.
            - Your only output is one PR.

            ## Privacy (Constitution P-7). This applies to the PR title and body.
            - Before you name a repo, get its visibility: `uv run scripts/gh_scan.py repo view <owner>/<repo> --json visibility -q .visibility`.
            - NEVER put the name, slug, URL, or verbatim content of a PRIVATE repo in the PR.
            - Make evidence from private repos general.
            - You can cite public repos.

            ## Task: make ONE pull request for the whole run, with every deletion in it
            1. Use this run branch from the default branch: `auto/delete/from-issue-$ISSUE_NUMBER`.
               Check for a duplicate run: `gh pr list --state open --head <branch> --json number`.
               If an open PR already uses this branch, STOP and report "PR already open for this selection".
               If not, run `git switch -c <branch>` from the default branch.
            2. For EACH resolved sheet, run `uv run scripts/delete_cheatsheet.py <slug>`.
               Give the script the value from column 4. The script accepts a `cheatsheets/` prefix and a `.md` suffix.
               If the script exits with a non-zero code (unknown name), report that number as skipped.
               Then CONTINUE with the next sheet. Do not stop the whole run.
               The script writes `index.md` again on each call.
               As a result, after the last deletion the index shows every removal.
            3. After all deletions, stage all changes one time: `git add -A`.
               This stages the removed `cheatsheets/*.md` files and the updated `index.md`.
            4. Open exactly ONE PR for the run.
               If the run deleted one or more sheets, run `git commit` and then `git push -u origin <branch>`.
               Then run `gh pr create` with this title and body:
               - Title: `chore(cheatsheet): delete selected stale sheets from #$ISSUE_NUMBER`
               - Body: a short SUMMARY with one bullet for each deleted sheet.
                 Give the use case and the target. Use only public evidence.
                 Never put a private repo identifier or private content in the body.
                 The last line of the body must be exactly `Closes #$ISSUE_NUMBER`.
                 This line makes GitHub close the issue when the owner merges the PR (O-5).
               Do NOT merge. You have no merge tool, and you must not try to merge.

            ## Finish
            - Sometimes NO sheet resolves. For example, you skip all numbers, all numbers have no match, or a duplicate PR exists.
              In that case, open zero PRs and do not push an empty branch.
              Print one line, "no cheatsheets deleted", with the reason.
            - Report these items:
              - the issue that you read
              - the selection that you parsed
              - the sheets that you deleted
              - the single PR that you opened, with the branch name
              - all skipped or unmatched numbers
